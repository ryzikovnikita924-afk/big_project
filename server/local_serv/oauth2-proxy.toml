provider = "oidc"
http_address = "0.0.0.0:4180"
redirect_url = "http://localhost:4180/oauth2/callback"

# Zitadel конфигурация
client_id = "YOUR_CLIENT_ID_FROM_ZITADEL"
client_secret = "YOUR_CLIENT_SECRET_FROM_ZITADEL"
oidc_issuer_url = "http://zitadel:8080"

# Автоматическое обнаружение
skip_oidc_discovery = false

scope = "openid profile email urn:zitadel:iam:org:project:roles"
email_domains = ["*"]
skip_provider_button = true

# Upstream
upstreams = [
    "http://game-core:8080/"
]

# Публичные маршруты
skip_auth_routes = [
    "^/$",
    "^/index\\.html$",
    "^/login\\.html$",
    "^/css/",
    "^/js/",
    "^/images/",
    "^/api/user/me$",
    "^/api/user/login$",
    "^/api/map$",
    "^/api/players$",
    "^/api/game-state$"
]

# Сессии
session_store_type = "cookie"
cookie_name = "_oauth2_proxy_geostrat"
cookie_secret = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"

# Проксирование
pass_user_headers = true
pass_access_token = true
set_xauthrequest = true

# Домены
whitelist_domains = [
    "localhost",
    "localhost:4180"
]

insecure_oidc_allow_unverified_email = true