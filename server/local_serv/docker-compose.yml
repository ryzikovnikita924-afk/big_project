services:
  postgres:
    image: postgres:17-alpine
    container_name: geostrat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geostrat}
      POSTGRES_USER: ${POSTGRES_USER:-geostrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geostrat123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U geostrat" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geostrat-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --http-port=8082 --hostname=localhost
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8082
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8082:8082"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - geostrat-network

  keycloak-db:
    restart: always
    container_name: keycloak-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    networks:
      - geostrat-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data



  redis:
    image: redis:7-alpine
    container_name: geostrat-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geostrat-network
    restart: unless-stopped

  game-core:
    build:
      context: ../../game-core
      dockerfile: Dockerfile
    container_name: geostrat-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-geostrat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-geostrat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-geostrat123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Keycloak OIDC configuration
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://localhost:8082/realms/geostrat
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8082/realms/geostrat
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - geostrat-network
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    container_name: geostrat-oauth2-proxy
    restart: unless-stopped
    ports:
      - "4180:4180"
    volumes:
      - ./oauth2-proxy.toml:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    depends_on:
      - keycloak
      - game-core
    networks:
      - geostrat-network


networks:

  geostrat-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  keycloak_postgres_data:
