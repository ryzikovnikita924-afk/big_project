<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoStrat - Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/auth.js"></script>
    <style>
        .bg-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="loader" class="loader">
    <div class="loader-spinner"></div>
</div>

<div id="main-content" class="bg-gradient min-h-screen" style="display: none;">
    <div class="hero min-h-screen">
        <div class="hero-content flex-col lg:flex-row-reverse gap-12">
            <div class="text-center lg:text-left">
                <h1 class="text-5xl font-bold text-white mb-4">GeoStrat</h1>
                <p class="text-xl text-white/90">Клеточная стратегия</p>
                <p class="text-md text-white/70 mt-4 max-w-md">Пошаговая PvP стратегия с экономикой и тактическими сражениями</p>
            </div>

            <div class="card w-full max-w-md bg-base-100 shadow-2xl">
                <div class="card-body">
                    <div class="text-center">
                        <h2 class="text-3xl font-bold">Добро пожаловать!</h2>
                        <p class="text-base-content/70 mt-2">Войдите через Keycloak</p>
                    </div>

                    <div id="page-alert"></div>

                    <div class="form-control mt-4">
                        <button id="login-button" class="btn btn-primary btn-block gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            </svg>
                            Войти через Keycloak
                        </button>
                    </div>

                    <div class="divider">или</div>

                    <div class="form-control">
                        <button id="guest-button" class="btn btn-outline btn-block">Продолжить как гость</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (async function() {
        const AuthApi = window.AuthApi;
        const loader = document.getElementById("loader");
        const mainContent = document.getElementById("main-content");
        const loginButton = document.getElementById("login-button");
        const guestButton = document.getElementById("guest-button");
        const searchParams = new URLSearchParams(window.location.search);

        // Проверяем авторизацию
        try {
            const { status, body } = await AuthApi.getCurrentUser();
            if (status === 200 && body?.authenticated) {
                // Уже авторизован - сразу в игру
                window.location.href = "/";
                return;
            }
        } catch (error) {
            console.error("Auth check error:", error);
        }

        // Показываем страницу входа
        loader.style.display = "none";
        mainContent.style.display = "block";

        // Показываем сообщения
        if (searchParams.has("error")) {
            AuthApi.showAlert("page-alert", "alert-error", "Не удалось выполнить вход");
        } else if (searchParams.has("logout")) {
            AuthApi.showAlert("page-alert", "alert-success", "Вы вышли из системы");
        }

        // Кнопка входа через Keycloak
        loginButton?.addEventListener("click", () => {
            // Перенаправляем на oauth2-proxy, который пойдёт в Keycloak
            window.location.href = "/oauth2/start?rd=/";
        });

        // Кнопка гостевого входа
        guestButton?.addEventListener("click", async () => {
            try {
                const response = await fetch("/api/auth/guest", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" }
                });
                if (response.ok) {
                    window.location.href = "/";
                } else {
                    AuthApi.showAlert("page-alert", "alert-error", "Не удалось войти как гость");
                }
            } catch (error) {
                AuthApi.showAlert("page-alert", "alert-error", "Ошибка при входе как гость");
            }
        });
    })();
</script>
</body>
</html>
