<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoStrat - Клеточная стратегия</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/game.js"></script>
    <style>
        .cell {
            width: 70px;
            height: 70px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 10px;
            border-radius: 4px;
            position: relative;
        }
        .cell:hover { transform: scale(0.95); filter: brightness(1.1); }
        .cell.selected { border: 3px solid #fbbf24; box-shadow: 0 0 10px #fbbf24; }
        .cell.can-attack { cursor: pointer; opacity: 1; }
        .cell.cannot-attack { cursor: not-allowed; opacity: 0.5; }
        .cell.can-build { cursor: pointer; border: 2px dashed #10b981; background: rgba(16,185,129,0.2); }
        .player1 { background: linear-gradient(135deg, #7f1d1d, #dc2626); }
        .player2 { background: linear-gradient(135deg, #1e3a5f, #2563eb); }
        .neutral { background: linear-gradient(135deg, #334155, #475569); }
        .water { background: linear-gradient(135deg, #0c4a6e, #0284c7); }
        #map {
            display: grid;
            grid-template-columns: repeat(10, 70px);
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
        }
        .terrain-icon { font-size: 28px; }
        .building-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-active {
            background-color: #10b981;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen bg-base-200">
<div id="loader" class="loader" style="display: none;">
    <div class="loader-spinner"></div>
</div>

<div id="main-content" style="display: none;">
    <div class="mx-auto flex min-h-screen max-w-7xl flex-col gap-6 px-4 py-6">
        <header class="hero rounded-box bg-base-100 shadow-sm">
            <div class="hero-content w-full flex-col items-start gap-6 lg:flex-row lg:items-center lg:justify-between">
                <div>
                    <p class="text-sm uppercase tracking-[0.3em] text-primary">GeoStrat</p>
                    <h1 class="text-4xl font-black">Клеточная стратегия</h1>
                    <p class="max-w-2xl text-base-content/70">
                        Пошаговая стратегия | PvP | Экономика
                    </p>
                </div>
                <div class="flex flex-col items-start gap-3 sm:items-end">
                    <div id="auth-state" class="badge badge-neutral badge-lg">Проверяем сессию...</div>
                    <div class="flex gap-3">
                        <button id="login-link" class="btn btn-primary btn-sm hidden">🔐 Войти</button>
                        <button id="new-game-btn" class="btn btn-primary btn-sm">🎮 Новая игра</button>
                        <button id="logout-button" class="btn btn-neutral btn-sm" type="button">🚪 Выйти</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="game-container" style="display: none;">
            <div class="grid gap-6 lg:grid-cols-[1fr_0.9fr]">
                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title">Игровая карта</h2>
                        <div id="map" class="flex justify-center"></div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="card bg-base-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="card-title">🎮 Управление ходом</h2>
                            <div class="flex justify-between">
                                <span>📊 Ход: <span id="turn-number">1</span></span>
                                <span>👑 Игрок: <span id="current-player">-</span></span>
                            </div>
                            <div id="turn-status" class="text-center font-bold">⏳ Загрузка...</div>
                            <div id="turn-alert" class="mt-2"></div>
                            <div class="flex gap-2">
                                <button id="start-turn-btn" class="btn btn-primary flex-1 hidden">🎯 Начать ход</button>
                                <button id="end-turn-btn" class="btn btn-secondary flex-1 hidden">✅ Завершить ход</button>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <button id="build-mode-btn" class="btn btn-outline btn-sm w-full">🏗️ Режим строительства</button>
                            </div>
                        </div>
                    </div>

                    <div class="card bg-base-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="card-title">💰 Мои ресурсы</h2>
                            <div class="grid grid-cols-2 gap-2">
                                <div>🪙 Золото: <span id="gold">0</span></div>
                                <div>🌲 Дерево: <span id="wood">0</span></div>
                                <div>🍖 Еда: <span id="food">0</span></div>
                                <div>⚔️ Войска: <span id="total-troops">0</span></div>
                                <div>🏰 Клеток: <span id="my-cells">0</span></div>
                            </div>
                        </div>
                    </div>

                    <div id="build-panel" class="card bg-base-100 shadow-sm hidden">
                        <div class="card-body">
                            <h2 class="card-title">🏗️ Строительство</h2>
                            <div id="build-alert" class="mb-2"></div>
                            <div id="available-buildings" class="space-y-2"></div>
                        </div>
                    </div>

                    <div class="card bg-base-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="card-title">🏆 Таблица лидеров</h2>
                            <div id="leaderboard-list" class="space-y-1 text-sm"></div>
                        </div>
                    </div>

                    <div class="card bg-base-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="card-title">📜 Лог боя</h2>
                            <div id="battle-log" class="h-32 overflow-y-auto space-y-1 text-xs"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (async function() {
        const AuthApi = window.AuthApi;
        const loader = document.getElementById("loader");
        const mainContent = document.getElementById("main-content");
        const gameContainer = document.getElementById("game-container");
        const newGameBtn = document.getElementById("new-game-btn");
        const logoutButton = document.getElementById("logout-button");
        const authStateBadge = document.getElementById("auth-state");

        const { status, body } = await AuthApi.getCurrentUser();
        const authenticated = status === 200 && body?.authenticated;

        if (!authenticated) {
            window.location.href = "/login.html";
            return;
        }

        loader.style.display = "none";
        mainContent.style.display = "block";

        authStateBadge.className = "badge badge-success badge-lg";
        authStateBadge.textContent = `Вы вошли как ${AuthApi.extractDisplayName(body.userInfo)}`;

        // Создаем экземпляр игры
        const game = new GeoStratGame();

        // Получаем информацию о пользователе
        try {
            const userResponse = await fetch('/api/user/me', { credentials: 'include' });
            if (userResponse.ok) {
                const userData = await userResponse.json();
                if (userData.authenticated) {
                    game.myPlayerId = userData.id;
                    game.myPlayerName = userData.username || userData.name || AuthApi.extractDisplayName(body.userInfo);
                    console.log("Player ID:", game.myPlayerId, "Name:", game.myPlayerName);
                }
            }
        } catch (error) {
            console.error("Failed to get user details:", error);
            game.myPlayerId = body.userInfo?.user || body.userInfo?.email;
            game.myPlayerName = AuthApi.extractDisplayName(body.userInfo);
        }

        // Функция для загрузки игры
        async function loadGame() {
            loader.style.display = 'flex';
            try {
                await game.loadMap();
                await game.checkGameState();

                // Проверяем, есть ли активная игра
                if (game.gameState && game.gameState.currentTurnPlayer) {
                    game.gameActive = true;
                    game.setupEventListeners();
                    gameContainer.style.display = 'block';
                    await game.loadBuildings();
                    console.log("Game loaded successfully");
                } else {
                    gameContainer.style.display = 'none';
                    document.getElementById('turn-status').innerHTML = '🎮 Нет активной игры. Нажмите "Новая игра"';
                }
            } catch (error) {
                console.error("Error loading game:", error);
                gameContainer.style.display = 'none';
                document.getElementById('turn-status').innerHTML = '🎮 Нет активной игры. Нажмите "Новая игра"';
            }
            loader.style.display = 'none';
        }

        // Загружаем игру
        await loadGame();

        // Обработчик кнопки новой игры
        newGameBtn.onclick = () => {
            window.location.href = "/choose-opponent.html";
        };

        // Обработчик выхода
        logoutButton.onclick = () => AuthApi.logout();

        // Периодическое обновление
        setInterval(() => {
            if (game.gameActive) {
                game.checkGameState();
                game.loadLeaderboard();
            }
        }, 3000);
    })();
</script>
</body>
</html>
